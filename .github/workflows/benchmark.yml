name: Catalog benchmark artifact
on:
  workflow_dispatch:
  schedule:
    - cron: "29 7 * * 0"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv sync --all-groups --locked
      - name: Refresh and enforce catalog performance ceilings
        run: |
          /usr/bin/time -v uv run rebrickable refresh --force --json > refresh.json 2> performance.txt
          /usr/bin/time -a -v uv run python scripts/benchmark_catalog.py > benchmark.json 2>> performance.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: catalog-performance
          path: |
            performance.txt
            refresh.json
            benchmark.json
          retention-days: 30
