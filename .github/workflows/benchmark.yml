name: Catalog benchmark artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --all-groups --locked
      - name: Refresh and enforce catalog performance ceilings
        run: |
          uv run --locked python scripts/measure_process.py --report refresh-memory.json --stdout refresh.json -- uv run --locked rebrickable refresh --force --json
          uv run --locked python scripts/measure_process.py --report query-memory.json --stdout benchmark.json -- uv run --locked python scripts/benchmark_catalog.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: catalog-performance
          path: |
            *-memory.json
            *-memory.txt
            refresh.json
            benchmark.json
          retention-days: 30
