name: Scheduled integration
on:
  workflow_dispatch:
    inputs:
      run_mutations:
        description: "Run disposable-account mutation round trip"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  catalog-and-read-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --all-extras --all-groups --locked
      - name: Full catalog refresh and offline smoke test
        run: |
          uv run rebrickable refresh --json > refresh-report.json
          uv run rebrickable search 3001 --kind part --json > search-report.json
      - name: Read-only API integration
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          REBRICKABLE_RUN_INTEGRATION: "1"
        run: |
          if [ -z "$REBRICKABLE_API_KEY" ]; then
            echo 'Read-only API key is not configured; skipping.'
            exit 0
          fi
          uv run python -m pytest tests/integration/test_live_readonly.py -m integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-artifacts
          path: "*-report.json"
          retention-days: 30

  guarded-mutation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --all-groups --locked
      - name: Disposable-user mutation with cleanup
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          REBRICKABLE_DISPOSABLE_USER_TOKEN: ${{ secrets.REBRICKABLE_DISPOSABLE_USER_TOKEN }}
          REBRICKABLE_RUN_MUTATIONS: I_UNDERSTAND
        run: uv run python -m pytest tests/integration/test_mutation_guarded.py -m mutation
