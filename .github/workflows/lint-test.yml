name: Lint and test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --all-groups --locked
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run ty check src/rebrickable
      - run: uv run pyrefly check src/rebrickable
      - run: uv run deptry .
      - run: uv run pyroma --min 10 .
      - name: Tests and 97% branch coverage
        run: uv run python -m pytest --cov=rebrickable --cov-branch --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - name: Verify wheel and sdist
        run: |
          python -m zipfile -l dist/*.whl | grep 'rebrickable/py.typed'
          tar -tzf dist/*.tar.gz | grep 'LICENSE.txt'
          tar -tzf dist/*.tar.gz | grep -E 'rebrickable-openapi-.*\.json'
          tar -tzf dist/*.tar.gz | grep 'tests/test_catalog_session.py'
          tar -tzf dist/*.tar.gz | grep 'docs/api.md'
      - name: Isolated install smoke test
        run: |
          python -m venv /tmp/rebrickable-install
          /tmp/rebrickable-install/bin/pip install dist/*.whl
          /tmp/rebrickable-install/bin/rebrickable api-spec --output /tmp/openapi.json
          /tmp/rebrickable-install/bin/python -c 'from importlib.metadata import version; import rebrickable; assert rebrickable.__version__ == version("rebrickable")'

  platform-smoke:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked
      - run: uv run rebrickable --version
      - run: uv run rebrickable api-spec --output openapi.json
      - run: uv run python -c "import json; assert json.load(open('openapi.json', encoding='utf-8'))['swagger'] == '2.0'"
