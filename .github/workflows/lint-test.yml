name: Lint and test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-groups --locked
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run ty check src/rebrickable
      - run: uv run pyrefly check src/rebrickable
      - run: uv run deptry .
      - run: uv run pyroma --min 10 .
      - name: Tests and 97% branch coverage
        run: uv run python -m pytest --cov=rebrickable --cov-branch --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv build
      - name: Verify wheel and sdist
        run: |
          python -m zipfile -l dist/*.whl | grep 'rebrickable/py.typed'
          tar -tzf dist/*.tar.gz | grep 'LICENSE.txt'
          tar -tzf dist/*.tar.gz | grep 'rebrickable-openapi-2026-08-01.json'
      - name: Isolated install smoke test
        run: |
          python -m venv /tmp/rebrickable-install
          /tmp/rebrickable-install/bin/pip install dist/*.whl
          /tmp/rebrickable-install/bin/rebrickable api-spec --output /tmp/openapi.json
          /tmp/rebrickable-install/bin/python -c 'import rebrickable; assert rebrickable.__version__ == "1.0.0"'
