name: Upstream API drift
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: openapi-drift
  cancel-in-progress: false
jobs:
  compare:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --all-groups --locked
      - run: curl --fail --silent --show-error --location 'https://rebrickable.com/api/v3/swagger/?format=openapi' --output /tmp/rebrickable-openapi.json
      - run: uv run python -m scripts.update_openapi /tmp/rebrickable-openapi.json
      - name: Push drift, find or create PR, and dispatch exact-commit validation
        run: uv run --locked python scripts/dispatch_drift.py
        env:
          GH_TOKEN: ${{ github.token }}
