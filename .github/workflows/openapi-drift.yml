name: Upstream API drift
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-groups --locked
      - run: curl --fail --silent --show-error --location 'https://rebrickable.com/api/v3/swagger/?format=openapi' --output /tmp/rebrickable-openapi.json
      - run: uv run python scripts/update_openapi.py /tmp/rebrickable-openapi.json
      - name: Open pinned drift PR
        run: |
          git diff --quiet && exit 0
          branch="automation/openapi-$(date -u +%Y-%m-%d)"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch -c "$branch"
          git add src/rebrickable/data src/rebrickable/api/operation_registry.py src/rebrickable/api/generated_requests.py
          git commit -m 'chore: vendor upstream API drift'
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" --title 'chore: review Rebrickable API drift' --body 'Automated dated Swagger update. Parity CI intentionally remains failing for unreviewed endpoints or signature changes.' || true
        env:
          GH_TOKEN: ${{ github.token }}
