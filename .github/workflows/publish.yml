name: Publish Python package
on:
  release:
    types: [published]
permissions: {}
jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/lint-test.yml # zizmor: ignore[self-repository] -- preserve same-commit reusable validation; relative syntax is supported by actionlint
    with:
      expected_sha: ${{ github.sha }}
      release_tag: ${{ github.event.release.tag_name }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify-pypi:
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the exact public artifact with propagation retries
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install --no-cache-dir --index-url https://pypi.org/simple "rebrickable==$version"; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              exit 1
            fi
            sleep 20
          done
          rebrickable --version
          rebrickable api-spec --output /tmp/openapi.json
          python -c 'import json; assert json.load(open("/tmp/openapi.json"))["swagger"] == "2.0"'
