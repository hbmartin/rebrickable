name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "13 6 * * 1"
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: python
          queries: security-extended,security-and-quality
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --all-extras --all-groups --locked
      - name: Audit locked Python dependencies
        run: uv run pip-audit
      - name: Run repository guardrails
        # semgrep 1.136.0 crashes on Python 3.14 (custom tp_new metaclasses).
        run: uvx --python 3.12 --from semgrep==1.136.0 --with 'setuptools<81' semgrep --config .semgrep.yml --error
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
