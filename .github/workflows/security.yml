name: Security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to scan (optional)
        type: string
        default: ""
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify requested revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/check_revision.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --all-extras --all-groups --locked
      - run: mkdir -p reports
      - name: Audit locked dependencies
        run: uv run --locked pip-audit --format json --output reports/dependencies.json 2>&1 | tee reports/dependency-audit.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: reports/
          retention-days: 14
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify requested revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/check_revision.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: mkdir -p reports
      - name: Repository guardrails
        # semgrep 1.136.0 crashes on Python 3.14 (custom tp_new metaclasses).
        run: uvx --python 3.12 --from semgrep==1.136.0 --with 'setuptools<81' semgrep --config .semgrep.yml --error --json --output reports/semgrep.json 2>&1 | tee reports/semgrep.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep
          path: reports/
          retention-days: 14
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify requested revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/check_revision.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          db-location: ${{ runner.temp }}/codeql-databases
          languages: python
          queries: security-extended,security-and-quality
          config: |
            query-filters:
              - exclude:
                  id: py/unused-import
              - exclude:
                  id: py/ineffectual-statement
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          output: reports/codeql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql
          path: |
            reports/codeql/
            ${{ runner.temp }}/codeql-databases/python/log/
          retention-days: 14
