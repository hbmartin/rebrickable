[project]
name = "rebrickable"
version = "1.2.0"
description = "Typed asynchronous Rebrickable catalog, API v3, and LDraw bridge"
keywords = ["rebrickable", "lego", "ldraw", "catalog", "bom"]
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [{ name = "Harold Martin", email = "harold.martin@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.21",
  "anyio>=4.14.2; sys_platform != 'emscripten'",
  "defusedxml>=0.7.1",
  "filelock>=3.20.3",
  "httpx2>=2.12.0",
  "platformdirs>=4.3.8",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# Security floors also apply when installing this extra from a wheel.
ldraw = ["pyldraw3>=1.5,<2", "requests>=2.33.0", "urllib3>=2.8.0"]

[project.urls]
Homepage = "https://github.com/hbmartin/rebrickable"
Repository = "https://github.com/hbmartin/rebrickable"
Documentation = "https://hbmartin.github.io/rebrickable/"
Issues = "https://github.com/hbmartin/rebrickable/issues"

[project.scripts]
rebrickable = "rebrickable.cli:_entrypoint"

[dependency-groups]
dev = [
  "deptry>=0.23",
  "hypothesis>=6.130",
  "pip-audit>=2.9",
  "pyrefly>=0.55",
  "pyroma621==6.2.0",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=7",
  "pytest-socket>=0.7",
  "ruff>=0.15",
  "ty>=0.0.21",
  "types-defusedxml>=0.7.0.20250822",
  "types-PyYAML>=6.0.12.20250915",
]
docs = ["zensical>=0.0.47"]

[build-system]
requires = ["uv_build>=0.8.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "rebrickable"
source-include = ["docs/**", "scripts/**", "tests/**", "zensical.toml"]

[tool.uv]
package = true
constraint-dependencies = ["requests>=2.33.0", "urllib3>=2.8.0"]

[tool.garuff]
# GAC001 assumes Python 3.14; postponed annotations are needed on Python 3.12.
# GAC002 requires particular base-class names; our DTO bases already set frozen=True.
# GAC005 replaces immutable tuples with mutable lists, changing public contracts.
# GAC008 would change established function signatures and flags pytest fixtures.
# GAC010 requires docstrings on every helper, special method, overload, and test.
ignore = ["GAC001", "GAC002", "GAC005", "GAC008", "GAC010"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "C901",
  "COM812",
  "CPY001",
  "D100",
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  "D203",
  "D212",
  "D213",
  "E501",
  "EM101",
  "EM102",
  "FBT003",
  "PERF401",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "PTH105",
  "PYI034",
  "S311",
  "S603",
  "S607",
  "SIM117",
  "SLF001",
  "T201",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
  "TRY301",
  "UP040",
  "UP046",
  "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN201", "D100", "D103", "PLR2004", "PT011", "S101", "S106"]
"scripts/*.py" = ["T201"]
"src/rebrickable/api/operation_registry.py" = ["E501"]
"src/rebrickable/bridge/ldraw.py" = ["PLC0415"]
"src/rebrickable/bridge/models.py" = ["B009"]
"src/rebrickable/session.py" = ["PLC0415"]

[tool.coverage.run]
branch = true
source = ["rebrickable"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 97

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--disable-socket --allow-unix-socket --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "integration: uses current Rebrickable downloads or API",
  "mutation: performs guarded user-account mutations",
  "performance: synthetic catalog resource bounds",
]

[tool.deptry]
extend_exclude = ["benchmarks", "scripts", "tests"]
known_first_party = ["rebrickable"]
package_module_name_map = { pyldraw3 = ["ldraw"] }

[tool.deptry.per_rule_ignores]
DEP002 = [
  "anyio", # Security floor for HTTPX2's transitive dependency.
  "pyldraw3", # Imported dynamically so the core package stays optional.
  "requests", # Security floor for pyldraw3's transitive dependency.
  "urllib3", # Constrains the transitive requests dependency in the ldraw extra.
]

[tool.pyrefly]
preset = "strict"
project-includes = ["src/rebrickable", "tests/typing"]
