[project]
site_name = "rebrickable"
site_url = "https://hbmartin.github.io/rebrickable/"
site_description = "Typed asynchronous Rebrickable catalog, API v3, and LDraw bridge"
site_author = "Harold Martin"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/hbmartin/rebrickable"
repo_name = "hbmartin/rebrickable"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Migrating to 1.1" = "migration-1.1.md" },
  { "Data model" = "data-model.md" },
  { "API v3" = "api.md" },
  { "CLI" = "cli.md" },
  { "LDraw bridge" = "ldraw-bridge.md" },
  { "Agent recipes" = "agent-recipes.md" },
  { "TUI integration" = "tui-integration.md" },
  { "Limitations" = "limitations.md" },
]

[project.theme]
features = ["content.code.copy", "navigation.sections", "navigation.top", "search.highlight"]
